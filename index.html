<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Iconic Essence — Catálogo de perfumes</title>
  <meta name="description" content="Catálogo de perfumes Iconic Essence. Edición 2026.">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
  <link rel="shortcut icon" href="/favicon.ico?v=2">
  <meta name="theme-color" content="#1a1a1a">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px;
      background: rgba(0,0,0,0.55);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 10;
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.05em; font-size: 14px; }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 6px;
      background: linear-gradient(135deg, #c084fc, #ec4899);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #fff; font-size: 13px;
      box-shadow: 0 0 18px rgba(192,132,252,0.5);
    }
    .info { display: flex; gap: 18px; font-size: 13px; opacity: 0.9; }
    .info a { color: #7dd3fc; text-decoration: none; }
    .info a:hover { text-decoration: underline; }
    @media (max-width: 700px) { .info { display: none; } }

    .stage { flex: 1; display: flex; min-height: 0; }
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 16px;
    }
    .main img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 8px 40px rgba(0,0,0,0.55);
      background: #fff;
      border-radius: 4px;
    }
    .nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,0.6); color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      font-size: 28px; width: 56px; height: 56px;
      border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.1s;
      backdrop-filter: blur(8px);
    }
    .nav-btn:hover { background: rgba(125,211,252,0.3); }
    .nav-btn:active { transform: translateY(-50%) scale(0.92); }
    .nav-prev { left: 16px; } .nav-next { right: 16px; }
    @media (max-width: 700px) {
      .nav-btn { width: 44px; height: 44px; font-size: 22px; }
      .nav-prev { left: 8px; } .nav-next { right: 8px; }
    }
    .counter {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 6px 16px; border-radius: 20px;
      font-size: 13px; font-variant-numeric: tabular-nums;
      backdrop-filter: blur(8px);
    }
    .thumbs {
      width: 140px;
      background: rgba(0,0,0,0.3);
      overflow-y: auto; overflow-x: hidden;
      padding: 10px;
      border-left: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }
    .thumbs::-webkit-scrollbar { width: 6px; }
    .thumbs::-webkit-scrollbar-track { background: transparent; }
    .thumbs::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    .thumbs img {
      width: 100%; cursor: pointer; opacity: 0.5;
      transition: opacity 0.2s, outline-color 0.2s;
      margin-bottom: 8px; border-radius: 4px;
      background: #000; outline: 2px solid transparent;
      display: block;
    }
    .thumbs img:hover { opacity: 0.85; }
    .thumbs img.active { opacity: 1; outline-color: #7dd3fc; }
    @media (max-width: 700px) {
      .stage { flex-direction: column; }
      .thumbs {
        width: 100%; height: 88px;
        overflow-y: hidden; overflow-x: auto;
        display: flex; gap: 6px;
        padding: 6px 10px;
        border-left: 0;
        border-top: 1px solid rgba(255,255,255,0.05);
        order: 2;
      }
      .thumbs img { width: 56px; margin-bottom: 0; flex-shrink: 0; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="brand-mark">IE</div>
      <span>ICONIC ESSENCE</span>
    </div>
    <div class="info">
      <a href="https://instagram.com/iconic_essence3" target="_blank" rel="noopener">@iconic_essence3</a>
      <a href="https://wa.me/573102501227" target="_blank" rel="noopener">310 250 1227</a>
      <a href="/canva" title="Vista con los Click Aquí originales">Vista Canva ↗</a>
    </div>
  </header>

  <div class="stage">
    <main class="main">
      <button class="nav-btn nav-prev" id="prev" aria-label="Anterior">‹</button>
      <img id="page" src="/catalog/1.jpg" alt="Página 1 del catálogo">
      <button class="nav-btn nav-next" id="next" aria-label="Siguiente">›</button>
      <div class="counter"><span id="current">1</span> / 91</div>
    </main>
    <aside class="thumbs" id="thumbs"></aside>
  </div>

  <script>
    const TOTAL = 91;
    let current = 1;
    const pageEl = document.getElementById("page");
    const counterEl = document.getElementById("current");
    const thumbsEl = document.getElementById("thumbs");

    const preload = new Map();
    function preloadImg(n) {
      if (n < 1 || n > TOTAL || preload.has(n)) return;
      const img = new Image();
      img.src = "/catalog/" + n + ".jpg";
      preload.set(n, img);
    }

    function go(n) {
      n = Math.max(1, Math.min(TOTAL, n));
      if (n === current) return;
      current = n;
      pageEl.src = "/catalog/" + n + ".jpg";
      counterEl.textContent = n;
      const activeThumb = thumbsEl.querySelector(".active");
      if (activeThumb) activeThumb.classList.remove("active");
      const newActive = thumbsEl.querySelector('img[data-page="' + n + '"]');
      if (newActive) {
        newActive.classList.add("active");
        newActive.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
      }
      preloadImg(n + 1);
      preloadImg(n + 2);
    }

    const frag = document.createDocumentFragment();
    for (let i = 1; i <= TOTAL; i++) {
      const t = document.createElement("img");
      t.src = "/catalog/" + i + ".jpg";
      t.alt = "Página " + i;
      t.loading = i <= 6 ? "eager" : "lazy";
      t.dataset.page = i;
      t.addEventListener("click", function() { go(i); });
      frag.appendChild(t);
    }
    thumbsEl.appendChild(frag);

    document.getElementById("prev").addEventListener("click", function() { go(current - 1); });
    document.getElementById("next").addEventListener("click", function() { go(current + 1); });
    document.addEventListener("keydown", function(e) {
      if (e.key === "ArrowLeft" || e.key === "a") go(current - 1);
      if (e.key === "ArrowRight" || e.key === "d") go(current + 1);
    });

    let touchStartX = 0;
    document.addEventListener("touchstart", function(e) { touchStartX = e.touches[0].clientX; }, { passive: true });
    document.addEventListener("touchend", function(e) {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) {
        if (dx > 0) go(current - 1);
        else go(current + 1);
      }
    }, { passive: true });

    const first = thumbsEl.querySelector('img[data-page="1"]');
    if (first) first.classList.add("active");
    preloadImg(2); preloadImg(3);
  </script>
</body>
</html>
